# alloy-evm computes post-block beneficiaries in a fixed order (ommers in header
# order, then the block beneficiary, then withdrawals) but collects them into an
# AddressMap, whose iteration order depends on a randomly seeded hasher. Normal
# execution does not care, but a keyless witness records state reads as a bare
# ordered stream, so the same block produced a different witness on every run -
# 2.5%% of blocks, all pure reorderings. The vendored copy adds an order-keeping
# variant and uses it; the order matches N42-gov5 Finalize (uncles, then miner).
[patch.crates-io]
alloy-evm = { path = "vendor/alloy-evm" }

# reth v2.5.1 uses unix-only positioned file I/O in two places without a cfg
# gate, so reth-provider and reth-cli-commands do not compile on Windows:
#   crates/static-file/types/src/changeset_offsets.rs  (read_exact_at)
#   crates/cli/commands/src/download/fetch.rs          (write_all_at)
# The local tree carries those two fixes (see patches/ in this repo).
# Patching just those two crates is not enough - they pull their siblings in
# by path, which would collide with the same crates from the git source - so
# every reth crate is redirected to the one patched tree.
# Delete this section once the fixes land upstream.
[patch."https://github.com/paradigmxyz/reth.git"]
reth = { path = "../reth-patched/bin/reth" }
